[workspace]
resolver = "2"
members = ["crates/coolmus-core", "crates/coolmus-render", "crates/coolmus-store", "crates/coolmus-pdf", "crates/onenote-import", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
coolmus-core = { path = "crates/coolmus-core" }
coolmus-render = { path = "crates/coolmus-render" }
coolmus-store = { path = "crates/coolmus-store" }
coolmus-pdf = { path = "crates/coolmus-pdf" }
onenote-import = { path = "crates/onenote-import" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
