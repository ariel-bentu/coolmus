[workspace]
resolver = "2"
members = ["crates/sketch-core", "crates/sketch-render", "crates/sketch-store", "crates/onenote", "crates/sketch-pdf", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sketch-core = { path = "crates/sketch-core" }
sketch-render = { path = "crates/sketch-render" }
sketch-store = { path = "crates/sketch-store" }
onenote = { path = "crates/onenote" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
