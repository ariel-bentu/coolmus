[package]
name = "sketcher"
description = "Fast pen sketching app: pages as files in folders, tags, OneNote import."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sketcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sketch-core.workspace = true
sketch-store.workspace = true
onenote.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri = { version = "2", features = [] }
env_logger = "0.11"
directories = "6"
rfd = "0.17"
open = "5"
base64 = "0.22"
