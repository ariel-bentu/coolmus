[package]
name = "coolmus"
description = "Fast pen sketching app: pages as PDF files in your own folders, with tags and OneNote import."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coolmus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coolmus-core.workspace = true
coolmus-store.workspace = true
coolmus-pdf.workspace = true
onenote-import.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri = { version = "2", features = [] }
env_logger = "0.11"
directories = "6"
rfd = "0.17"
open = "5"
base64 = "0.22"
clipboard-rs = "0.3"
percent-encoding = "2"
