[package]
name = "sketcher"
description = "Fast pen sketching app with notebooks, tags and OneNote sync."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sketcher"
path = "src/main.rs"

[dependencies]
sketch-core.workspace = true
sketch-render.workspace = true
sketch-store.workspace = true
onenote.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = "0.36"
env_logger = "0.11"
directories = "6"
rfd = "0.17"
open = "5"
