<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketcher</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="toolbar">
    <div class="group" role="radiogroup">
      <button class="tool" data-tool="select" data-i18n-title="selectTip">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
        <span data-i18n="select"></span>
      </button>
      <button class="tool" data-tool="pen" data-i18n-title="penTip">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
        <span data-i18n="pen"></span>
      </button>
      <button class="tool" data-tool="text" data-i18n-title="textTip">
        <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
        <span data-i18n="text"></span>
      </button>
      <button class="tool" data-tool="eraser" data-i18n-title="eraserTip">
        <svg viewBox="0 0 24 24"><path d="M3 17l8-8 7 7-4 4H7z"/><path d="M14 20h7"/></svg>
        <span data-i18n="eraser"></span>
      </button>
      <button class="tool" data-tool="pan" data-i18n-title="panTip">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
        <span data-i18n="pan"></span>
      </button>
      <button id="imageBtn" data-i18n-title="imageTip">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
        <span data-i18n="image"></span>
      </button>
    </div>
    <div class="sep"></div>
    <div class="group" id="swatches"></div>
    <input type="color" id="color" data-i18n-title="customColor" />
    <div class="sep"></div>
    <label class="group"><span data-i18n="width"></span>
      <input type="range" id="width" min="0" max="100" step="1" />
      <output id="widthOut"></output>
    </label>
    <button id="styleBtn" aria-haspopup="menu" data-i18n-title="style"><span id="stylePreview"></span><svg viewBox="0 0 24 24" class="caret"><path d="M7 10l5 5 5-5"/></svg></button>
    <button id="pressure" class="toggle" data-i18n="pressure" data-i18n-title="pressureTip"></button>
    <label class="group" id="eraserGroup" hidden><span data-i18n="eraserSize"></span>
      <input type="range" id="eraserSize" min="2" max="60" step="1" />
    </label>
    <label class="group" id="textGroup" hidden><span data-i18n="textSize"></span>
      <input type="range" id="textSize" min="10" max="72" step="1" />
      <output id="textSizeOut"></output>
    </label>
    <div class="sep"></div>
    <button id="undo" class="icon" data-i18n-title="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button id="redo" class="icon" data-i18n-title="redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
    <div class="sep"></div>
    <button id="zoomOut" class="icon" data-i18n-title="zoomOut">−</button>
    <button id="zoomFit" data-i18n-title="fitWidth">100%</button>
    <button id="zoomIn" class="icon" data-i18n-title="zoomIn">+</button>
    <button id="fullBtn" class="icon toggle" data-i18n-title="fullPage"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="spacer"></div>
    <button id="pageMenu" data-i18n="pageMenu"></button>
    <button id="oneNoteBtn" data-i18n="oneNoteImport" data-i18n-title="oneNoteImportTip"></button>
    <button id="settingsBtn" class="icon" data-i18n-title="settings"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button id="langBtn" data-i18n="language" data-i18n-title="languageTip"></button>
  </header>


  <main>
    <aside id="sidebar">
      <div class="treeActions">
        <button id="newPageBtn" data-i18n-title="newPageTip"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v6M9 13h6"/></svg><span data-i18n="newPage"></span></button>
        <button id="newFolderBtn" data-i18n-title="newFolderTip"><svg viewBox="0 0 24 24"><path d="M3 6a1 1 0 011-1h5l2 2h9a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M12 10v6M9 13h6"/></svg><span data-i18n="newFolder"></span></button>
      </div>
      <input id="search" type="search" dir="auto" data-i18n-placeholder="search" />
      <div id="tagCloud"></div>
      <div id="tree"></div>
      <p class="hint" data-i18n="treeHint"></p>
    </aside>
    <div id="pageCol">
      <div id="pagebar">
        <div class="side">
          <div id="tags"></div>
          <input id="tagInput" dir="auto" list="tagSuggestions" data-i18n-placeholder="addTag" />
          <datalist id="tagSuggestions"></datalist>
        </div>
        <input id="title" dir="auto" data-i18n-placeholder="titlePlaceholder" data-i18n-title="titleTip" />
        <div class="side end">
          <span id="imported" class="muted" hidden data-i18n="importedFromOneNote"></span>
          <span id="spinner" class="spinner" hidden></span>
        </div>
      </div>
      <section id="stage"></section>
    </div>
    <aside id="onenote" hidden></aside>
  </main>

  <footer id="status">
    <span id="statusText"></span>
    <span class="spacer"></span>
    <span id="statusPage" class="muted"></span>
  </footer>

  <button id="exitFull" class="floating">
    <svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    <span data-i18n="exitFullPage"></span>
  </button>
  <div id="menu" class="menu" hidden></div>
  <dialog id="dialog"></dialog>
  <div id="toasts"></div>
</body>
</html>
